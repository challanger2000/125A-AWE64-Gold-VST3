name: P108 private original Win95 runner source-only negative tests

on:
  push:
    branches:
      - research/p107-original-x64-dynarec-guest-branch-capture
    paths:
      - '.github/workflows/p108-private-owner-audit-unit.yml'
      - 'tools/p108_private_win95_original_capture.py'
      - 'tools/p108_resolve_private_original_package.py'
      - 'tools/p108_compare_public_stress_pe.py'
      - 'tools/p108_rebuild_exact_public_stress_pe.py'
      - 'tools/p108_verify_direct_jcc.py'
      - 'tests/test_p108_private_win95_original_capture.py'
      - 'tests/test_p108_resolve_private_original_package.py'
  workflow_dispatch:

concurrency:
  group: p108-private-python-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  exact-public-win95-stress-rebuild-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install public Win95-targeted P54C i586 compiler
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Reproduce the exact public Creative three-bank stress PE32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p108-public-guest
          i686-w64-mingw32-gcc -Os -Wall -Wextra -Werror -std=c99 \
            -DP003_ORIGINAL_MODE_STRESS=1 \
            -march=pentium -mtune=pentium -ffreestanding -fno-builtin \
            -fno-stack-protector -nostdlib -Wl,-e,_p002_ram_entry@0 \
            -Wl,--disable-dynamicbase,--disable-nxcompat \
            -Wl,--major-subsystem-version,4 -Wl,--minor-subsystem-version,0 \
            -o /tmp/p108-public-guest/P002RAM.EXE \
            src/win95/p002_original_creative_ram_bank_capture.c \
            -lwinmm -lkernel32 -lgcc
          sha256sum /tmp/p108-public-guest/P002RAM.EXE
          echo 'P108_EXPECTED_ORIGINAL_WIN95_3BANK_PE32_SHA256=3c9306261ed599073f80d9695a8d73140ea65e2de101dc431169c2e6b3f6bc9f'
          actual=$(sha256sum /tmp/p108-public-guest/P002RAM.EXE | cut -d' ' -f1)
          if [[ "$actual" == "3c9306261ed599073f80d9695a8d73140ea65e2de101dc431169c2e6b3f6bc9f" ]]; then
            echo 'P108_ORIGINAL_3BANK_PUBLIC_SOURCE_EXACT_BINARY_REPRODUCTION_PASS'
          else
            echo 'P108_ORIGINAL_3BANK_PUBLIC_SOURCE_BINARY_REPRODUCTION_UNPROVEN'
          fi
      - name: Retrieve only the public SHA-verified original CI stress PE32
        uses: actions/download-artifact@v4
        with:
          name: P003-Win95-Original-Creative-3-Bank-Voice-Stress-PE32
          run-id: 43787795937
          github-token: ${{ github.token }}
          path: /tmp/p108-published-stress
      - name: Independently compare public PE32 code sections and COFF metadata
        shell: bash
        run: |
          set -euo pipefail
          reference=$(find /tmp/p108-published-stress -type f -name P002RAM.EXE -print -quit)
          test -n "$reference"
          python3 tools/p108_compare_public_stress_pe.py \
            --published-original-pe32 "$reference" \
            --recompiled-pe32 /tmp/p108-public-guest/P002RAM.EXE
      - name: Reproduce SHA-bit-exact original public 3bank PE32 by correcting ONLY proven build metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/p108_rebuild_exact_public_stress_pe.py --verify-only
      - name: Never publish synthetic or original guest sample data
        run: echo 'Only original public Win95 test C source compiled; no private Creative VxD, ROM or 86Box VM'
  private-source-only-unit-tests:
    name: P108 safe fake-data source tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact SHA-locked, fail-closed original package resolution
        shell: bash
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest discover -s tests \
            -p 'test_p108_resolve_private_original_package.py' -v
      - name: Test automated private Win95 run and physical IO gates (synthetic ONLY)
        shell: bash
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest discover -s tests \
            -p 'test_p108_private_win95_original_capture.py' -v
      - name: Verify original-stress comparison SF2 can be generated without any owner sample data
        shell: bash
        run: |
          python -c "import hashlib,sys;sys.path.insert(0,'tools');from p003_owner_two_bank_run import generated_original_mode_stereo_sf2 as gen;print('P108_SOURCE_CLEAN_ORIGINAL_MODE_STEREO_SF2_SHA256='+hashlib.sha256(gen()).hexdigest())"
      - name: Test five source original Jcc flag predicates and strict trace crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python tools/p108_verify_direct_jcc.py --selftest
          echo 'P108_PRIVATE_WIN95_RUNNER_UNIT_GATE_PASS no_original_VM_or_Creative_data_uploaded=TRUE'
