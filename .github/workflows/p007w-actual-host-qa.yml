name: P007W actual Windows VST3 host state and optional private audio QA
on:
  push:
    branches: [research/p007w-real-vst3-host-qa-20261118, fix/p007z-p165-original-complete-gui-20261118, research/p007aa-creative-nrpn-20261118, fix/p007ae-paced-creative-uart-20261118]
    paths:
      - "experiments/p007-inprocess-86box/tests/P007ActualHostQA.cpp"
      - "experiments/p007-inprocess-86box/tests/P007CreativeNrpnTest.cpp"
      - "experiments/p007-inprocess-86box/tests/P007CreativeNrpnPacerTest.cpp"
      - "experiments/p007-inprocess-86box/tests/P007OriginalControlDifferential*.cpp"
      - "experiments/p007-inprocess-86box/tests/P007OriginalControlDifferential.hpp"
      - "experiments/p007-inprocess-86box/tests/P007StateCodecTest.cpp"
      - "experiments/p007-inprocess-86box/tests/P007SyntheticCoreMock.cpp"
      - "experiments/p007-inprocess-86box/tests/P007ZOriginalP165EditorHost.py"
      - "experiments/p007-inprocess-86box/vst3/**"
      - ".github/workflows/p007w-actual-host-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-windows-vst3-state:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Restore tested original internal core DLLs
        uses: actions/download-artifact@v4
        with:
          name: P007-Original-86Box-InProcess-DLL-Feasibility-Only
          run-id: 44143478773
          github-token: ${{ github.token }}
          path: build/gui-base
      - name: Fetch exact tested Steinberg SDK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --recursive --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          if($LASTEXITCODE -ne 0){throw "SDK clone"}
          $sha=(git -C external/vst3sdk rev-parse HEAD).Trim()
          if($sha -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96'){throw "SDK SHA mismatch: $sha"}
      - name: Configure real VST3 and independent hosting executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S experiments/p007-inprocess-86box/vst3 -B build/p007-vst3 -G 'Visual Studio 17 2022' -A x64 -DP007_SDK_ROOT="$env:GITHUB_WORKSPACE/external/vst3sdk"
          if($LASTEXITCODE -ne 0){throw 'CMake failed'}
      - name: Exact original Creative NRPN 12 controls and state v1/v2 proof
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build build/p007-vst3 --config Release --target P007CreativeNrpnTest P007StateCodecTest --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Creative NRPN or project-state tests failed to build'}
          cmake --build build/p007-vst3 --config Release --target P007CreativeNrpnPacerTest --parallel 2
          if($LASTEXITCODE -ne 0){throw '16550 UART NRPN pacer test build failed'}
          & 'build/p007-vst3/Release/P007CreativeNrpnPacerTest.exe'
          if($LASTEXITCODE -ne 0){throw 'Original Win95 16550 FIFO pacing test failed'}
          & 'build/p007-vst3/Release/P007CreativeNrpnTest.exe'
          if($LASTEXITCODE -ne 0){throw 'Creative original twelve-NRPN protocol or retry failure'}
          & 'build/p007-vst3/Release/P007StateCodecTest.exe'
          if($LASTEXITCODE -ne 0){throw 'VST3 state v2 or legacy v1 corruption/migration failure'}
          cmake --build build/p007-vst3 --config Release --target P007OriginalControlDifferentialTest --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Original PCM A/B/A numerical oracle build failed'}
          & 'build/p007-vst3/Release/P007OriginalControlDifferentialTest.exe'
          if($LASTEXITCODE -ne 0){throw 'Original PCM A/B/A negative or positive control failed'}
      - name: Restore original internal 86Box DLLs into the single VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=(Resolve-Path 'build/gui-base/p007-vst3/VST3/Release/AWE64_Gold_P007.vst3/Contents/x86_64-win').Path
          $dest='build/p007-vst3/VST3/Release/AWE64_Gold_P007.vst3/Contents/x86_64-win'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$source/*" $dest -Force
          Remove-Item "$dest/AWE64_Gold_P007.vst3" -ErrorAction SilentlyContinue
          if(!(Test-Path "$dest/125A_AWE_Core.dll")){throw 'Original 86Box core missing'}
      - name: Build the production VST3 and P007W independent host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build build/p007-vst3 --config Release --target AWE64_Gold_P007 --parallel 3
          if($LASTEXITCODE -ne 0){throw 'VST3 build or validator failed'}
          cmake --build build/p007-vst3 --config Release --target P007ActualHostQA --parallel 3
          if($LASTEXITCODE -ne 0){throw 'Independent host build failed'}
      - name: Execute real compiled VST3 save-close-reopen corruption and controller QA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $plugin=(Resolve-Path 'build/p007-vst3/VST3/Release/AWE64_Gold_P007.vst3').Path
          $qaExe=(Resolve-Path 'build/p007-vst3/Release/P007ActualHostQA.exe').Path
          & $qaExe $plugin | Tee-Object -FilePath build/p007w-actual-host.log
          if($LASTEXITCODE -ne 0){throw 'Actual VST3 host QA failed'}
          if(!(Select-String -Path build/p007w-actual-host.log -Pattern 'P007W_REAL_WINDOWS_VST3_TWO_INSTANCE_PROJECT_STATE_REOPEN_PASS' -Quiet)){
            throw 'No real VST3 state reopen acceptance marker'
          }
      - name: Verify original Creative PCM proof rejects constant background and missing baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build build/p007-vst3 --config Release --target P007OriginalAudioProofTest --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Original MIDI onset proof unit build failed'}
          & 'build/p007-vst3/Release/P007OriginalAudioProofTest.exe' | Tee-Object -FilePath 'build/p007y-original-audio-proof-rules.log'
          if($LASTEXITCODE -ne 0){throw 'Original audio before/after note attribution test failed'}
      - name: Build disposable synthetic core DLL (never a Creative emulator)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build build/p007-vst3 --config Release --target P007SyntheticCoreMock --parallel 2
          if($LASTEXITCODE -ne 0){ throw 'Synthetic-only CI core build failed' }
      - name: Real Windows VST3 MIDI -> synthetic in-process guest -> PCM + master and transport acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=(Resolve-Path 'build/p007-vst3/VST3/Release/AWE64_Gold_P007.vst3').Path
          $dest=Join-Path $env:GITHUB_WORKSPACE 'build/p007-synthetic/AWE64_Gold_P007.vst3'
          New-Item -ItemType Directory -Force (Split-Path $dest -Parent) | Out-Null
          Copy-Item -LiteralPath $source -Destination $dest -Recurse -Force
          $native=Join-Path $dest 'Contents/x86_64-win'
          $mock=(Resolve-Path 'build/p007-vst3/synthetic-core/Release/P007SyntheticCoreMock.dll').Path
          Copy-Item -LiteralPath $mock -Destination (Join-Path $native '125A_AWE_Core.dll') -Force
          $private=Join-Path $dest 'Contents/Resources/PrivateVM'
          New-Item -ItemType Directory -Force (Join-Path $private 'vm') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $private 'roms') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $private 'assets') | Out-Null
          Set-Content -LiteralPath (Join-Path $private 'P007_SYNTHETIC_TEST_ONLY.marker') -Value 'SYNTHETIC CI ONLY. NO ORIGINAL CREATIVE.' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $private 'vm/win95.img') -Value 'SYNTHETIC CI ONLY' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $private 'vm/P007_AWE64.cfg') -Value '[Synthetic]' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $private '86box.cfg') -Value '[Synthetic]' -Encoding ascii
          $env:LOCALAPPDATA=Join-Path $env:GITHUB_WORKSPACE 'build/p007-synthetic-profile'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $qaExe=(Resolve-Path 'build/p007-vst3/Release/P007ActualHostQA.exe').Path
          & $qaExe $dest --synthetic | Tee-Object -FilePath 'build/p007x-synthetic-host.log'
          if($LASTEXITCODE -ne 0){ throw 'Real VST3 synthetic audio and MIDI host acceptance failed' }
          if(!(Select-String -Path 'build/p007x-synthetic-host.log' -Pattern 'P007X_REAL_WINDOWS_VST3_SYNTHETIC_GUEST_44K_48K_96K_AUDIO_MIDI_PASS' -Quiet)){
            throw 'Missing synthetic original-provenance-labeled acceptance marker'
          }
          # Negative control: the same synthetic CI bundle must NEVER be
          # accepted as original Creative/Win95, even with valid VST3 audio.
          & $qaExe $dest --private-audio *> 'build/p007y-refuse-fake-original.log'
          if($LASTEXITCODE -eq 0){
            throw 'CRITICAL: synthetic guest incorrectly accepted as original Creative'
          }
          if(Select-String -Path 'build/p007y-refuse-fake-original.log' -Pattern 'P007Y_PRIVATE_REAL_VST3_ORIGINAL_CREATIVE_NOTEON_PCM_PASS' -Quiet){
            throw 'CRITICAL: a forged original audio PASS marker was emitted'
          }
          Write-Host 'P007Y_PUBLIC_SYNTHETIC_AS_ORIGINAL_CREATIVE_REJECTED_PASS'
          # P007AD must also reject fake guest in strict original sound A/B/A
          # mode; a mere outgoing NRPN MIDI stream does NOT prove audio.
          & $qaExe $dest --private-nrpn *> 'build/p007ad-refuse-fake-original.log'
          if($LASTEXITCODE -eq 0){
            throw 'CRITICAL: fake Win95/Creative core accepted as original NRPN audio'
          }
          if(Select-String -Path 'build/p007ad-refuse-fake-original.log' -Pattern 'P007AD_PRIVATE_REAL_WIN95_CREATIVE_NRPN_ABA_PCM_PASS' -Quiet){
            throw 'CRITICAL: forged original A/B/A PCM PASS marker'
          }
          Write-Host 'P007AD_PUBLIC_SYNTHETIC_NRPN_AS_ORIGINAL_PCM_REJECTED_PASS'
          # The expected negative-control exit code must not turn this successful
          # rejection test into a failed GitHub Actions PowerShell step.
          exit 0
      - name: Build real Steinberg EditorHost for full ORIGINAL P165 interface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S external/vst3sdk -B build/editorhost -G "Visual Studio 17 2022" -A x64 -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          if($LASTEXITCODE -ne 0){throw 'Steinberg EditorHost configure failed'}
          cmake --build build/editorhost --config Release --target editorhost --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Steinberg EditorHost compile failed'}
      - name: Actual Windows editor must render all TWELVE correct P165 knobs plus ROM and SF2
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $editor=(Get-ChildItem build/editorhost -Filter editorhost.exe -File -Recurse |
            Where-Object {$_.FullName -match 'Release'} |
            Select-Object -First 1 -ExpandProperty FullName)
          if(-not $editor){throw 'Steinberg EditorHost.exe unavailable'}
          $plugin=(Resolve-Path 'build/p007-vst3/VST3/Release/AWE64_Gold_P007.vst3').Path
          python experiments/p007-inprocess-86box/tests/P007ZOriginalP165EditorHost.py --editorhost "$editor" --plugin "$plugin" --output build/p007z-original-p165-gui
          if($LASTEXITCODE -ne 0){throw 'Actual original P165 full GUI acceptance FAIL'}
      - name: Preserve real native full P165 12-knob Win32 screenshots and mouse QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P007Z-Actual-Original-P165-Complete-GUI-Screenshots
          path: build/p007z-original-p165-gui/**
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve original PCM attribution and anti-fake QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P007Y-Windows-Original-Audio-Proof-Attribution-Checks
          path: |
            build/p007y-original-audio-proof-rules.log
            build/p007y-refuse-fake-original.log
            build/p007ad-refuse-fake-original.log
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic-only Windows audio/MIDI QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P007X-Win64-SYNTHETIC-ONLY-VST3-Audio-MIDI-QA
          path: build/p007x-synthetic-host.log
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve sanitized host output (NO private licensed resources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P007W-Windows-Actual-VST3-Host-State-QA
          path: build/p007w-actual-host.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish standalone Windows QA executable (not part of the VST3)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P007W-Windows-Private-Audio-Host-Tester-EXE
          path: build/p007-vst3/Release/P007ActualHostQA.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish updated source-pinned ORIGINAL 86Box Windows VST3 bundle without licensed guest media
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P007Y-Win64-P165-VST3-Original-Core-NO-PRIVATE-WIN95-ROM
          path: build/p007-vst3/VST3/Release/AWE64_Gold_P007.vst3/**
          if-no-files-found: error
          retention-days: 7
