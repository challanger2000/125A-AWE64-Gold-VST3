name: P002 Creative primary API and register oracle
on:
  push:
    branches: [develop/p002-creative-register-oracle]
    paths:
      - 'src/creative_compat/**'
      - 'tests/p002_midi_contract.cpp'
      - 'tests/test_p002_register_oracle.py'
      - 'tools/p002_register_oracle.py'
      - 'CMakeLists.txt'
      - '.github/workflows/p002-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creative-winmm-and-original-driver-oracle-contract:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Source-built Creative API and WinMM contract, original DSP hash lock
        shell: pwsh
        run: |
          cmake -S . -B build-p002 -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'P002 configure or pinned original DSP verification failed' }
          cmake --build build-p002 --config Release --parallel 2 --target awe64_p002_midi_contract awe64_chip_contract awe64_direct_fork_fixture awe64_replay
          if ($LASTEXITCODE -ne 0) { throw 'P002 actual Windows x64 test binaries failed to compile' }
          ctest --test-dir build-p002 -C Release --output-on-failure -V
          if ($LASTEXITCODE -ne 0) { throw 'P001 regression or P002 WinMM contract failed' }
      - name: Strict negative controls for register timing, direction, port, bits, order, and missing events
        shell: pwsh
        run: |
          python -m py_compile tools/p002_register_oracle.py tests/test_p002_register_oracle.py
          if ($LASTEXITCODE -ne 0) { throw 'P002 strict oracle Python syntax invalid' }
          python -m unittest discover -s tests -p test_p002_register_oracle.py -v
          if ($LASTEXITCODE -ne 0) { throw 'P002 register differential negative controls FAILED' }
          Write-Host 'P002_ORIGINAL_API_MIDI_AND_REGISTER_COMPARATOR_CONTRACT_PASS; ORIGINAL_CREATIVE_NATIVE_TRANSLATION_NOT_RUN'
