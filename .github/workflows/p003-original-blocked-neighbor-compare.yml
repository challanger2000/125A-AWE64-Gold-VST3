name: P003 blocked-neighbor original VXD vs actual developer allocator
on:
  push:
    branches: [research/p003-v5-voice-row-capture]
    paths:
      - 'tests/p003_original_blocked_neighbor_previous_sentinel.cpp'
      - '.github/workflows/p003-original-blocked-neighbor-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_original_gate_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Validate original x86 blocked-neighbor semantics against research candidate
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_blocked_neighbor_previous_sentinel.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-research-original"
          "$RUNNER_TEMP/p003-research-original"
      - name: Inspect actual P002 developer commit read-only
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-source"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_blocked_neighbor_previous_sentinel.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp" \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-allocator"
          set +e
          "$RUNNER_TEMP/p003-dev-allocator"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_P002_HEAD_WRONG_PAIR_INDEPENDENTLY_REPRODUCED pinned_sha=$DEV_SHA"
            exit 0
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_P002_HEAD_PAIR_CORRECT pinned_sha=$DEV_SHA"
            exit 0
          else
            echo "P003_P002_HEAD_UNEXPECTED_STATUS=$STATUS"
            exit 1
          fi
