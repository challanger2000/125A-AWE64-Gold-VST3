name: P003 blocked-neighbor original VXD vs actual developer allocator
on:
  push:
    branches: [research/p003-v5-voice-row-capture]
    paths:
      - 'tests/p003_original_blocked_neighbor_previous_sentinel.cpp'
      - 'tests/p003_original_mode2_high_marker_lazy_chip_read.cpp'
      - 'tests/p003_original_mode2_ccca_only_validated.cpp'
      - 'tests/p003_original_mode2_vtft_dcysusv_provenance.cpp'
      - 'tests/p003_original_mode0_lazy_source_reads.cpp'
      - 'tests/p003_original_win95_mode0_32_physical_voices.cpp'
      - 'tests/p003_original_mode0_highvoice_selection_ties.cpp'
      - 'tools/p003_audit_original_mode0_complete_release_private.py'
      - 'tests/test_p003_original_mode0_complete_release_audit.py'
      - 'tests/p003_original_all32_release_vtft_words.cpp'
      - 'src/creative_compat/P003OriginalWavetableTimer.h'
      - 'src/creative_compat/P003OriginalWavetableTimer.cpp'
      - 'tests/p003_original_wavetable_timer.cpp'
      - 'tests/p003_original_modes_deterministic_differential_15000.cpp'
      - 'tests/p002_native_vxd_mono_ranking.cpp'
      - 'src/creative_compat/CreativeVxdMonoVoiceRanking.cpp'
      - 'src/creative_compat/CreativeVxdMonoVoiceRanking.h'
      - 'tests/p003_original_vxd_additional_allocator_modes.cpp'
      - 'src/creative_compat/CreativeVxdAdditionalAllocatorModes.h'
      - 'src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp'
      - '.github/workflows/p003-original-blocked-neighbor-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_original_gate_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Check exact DCYSUSV release and VTFT setup hardware words for all 32 voices
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_all32_release_vtft_words.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-all32-source-words"
          "$RUNNER_TEMP/p003-all32-source-words"
      - name: Adversarial audit of original mode0 release→VTFT trace parser (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p003_original_mode0_complete_release_audit.py' -v
      - name: Run complete legacy mode0 C++23 numeric and release-write regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p002_native_vxd_mono_ranking.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-legacy-mode0"
          "$RUNNER_TEMP/p003-legacy-mode0"
      - name: Test original physical voices 30/31 busy selection, tie and sample-end
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_mode0_highvoice_selection_ties.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-original-30-31-ranked"
          "$RUNNER_TEMP/p003-original-30-31-ranked"
      - name: Verify original mode0 32 physical voices against research source
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_win95_mode0_32_physical_voices.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-source-mode0-32"
          "$RUNNER_TEMP/p003-source-mode0-32"
      - name: Verify pinned developer candidate excludes genuine original mode0 voices 30 and 31
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-mode0-32"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_win95_mode0_32_physical_voices.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp" \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-mode0-32.bin"
          set +e
          "$RUNNER_TEMP/p003-dev-mode0-32.bin"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_DEVELOPER_MODE0_30_VOICE_TRUNCATION_REPRODUCED sha=$DEV_SHA"
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_DEVELOPER_MODE0_32_VOICE_PATH_PASS sha=$DEV_SHA"
          else
            echo "P003_DEVELOPER_MODE0_32_UNEXPECTED_EXIT=$STATUS"
            exit 1
          fi
      - name: Verify source-ordered original mode0 early reads in corrected research source
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_mode0_lazy_source_reads.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-mode0-source"
          "$RUNNER_TEMP/p003-mode0-source"
      - name: Compare original mode0 early exit against pinned developer C++23
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-mode0"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_mode0_lazy_source_reads.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-mode0-source"
          set +e
          "$RUNNER_TEMP/p003-dev-mode0-source"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_DEV_MODE0_SPECULATIVE_UNVISITED_CHIP_READ_REPRODUCED sha=$DEV_SHA"
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_DEV_MODE0_ORIGINAL_EARLY_READ_PASS sha=$DEV_SHA"
          else
            echo "P003_DEV_MODE0_UNEXPECTED_EXIT=$STATUS"
            exit 1
          fi
      - name: Verify original 86Box CPU-block / 32:32 wavetable timer mechanism
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_wavetable_timer.cpp \
            src/creative_compat/P003OriginalWavetableTimer.cpp \
            -o "$RUNNER_TEMP/p003-virtual-wavetable-timer"
          "$RUNNER_TEMP/p003-virtual-wavetable-timer"
      - name: Run 15k seeded original-x86 mode0/1/2 differential vectors
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_modes_deterministic_differential_15000.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-original-modes-differential"
          "$RUNNER_TEMP/p003-original-modes-differential"
      - name: Validate original x86 blocked-neighbor semantics against research candidate
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_blocked_neighbor_previous_sentinel.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-research-original"
          "$RUNNER_TEMP/p003-research-original"
      - name: Verify mode2 high-marker source short-circuit in research correction
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_mode2_high_marker_lazy_chip_read.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-research-mode2"
          "$RUNNER_TEMP/p003-research-mode2"
      - name: Run full existing P003 original allocator regression suite
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_vxd_additional_allocator_modes.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-all-modes-regression"
          "$RUNNER_TEMP/p003-all-modes-regression"
      - name: Validate source-matched VTFT-only and conditional DCYSUSV/CCCA paths in C++23
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_mode2_vtft_dcysusv_provenance.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-source-read-provenance"
          "$RUNNER_TEMP/p003-source-read-provenance"
      - name: Compare VTFT-only read provenance against pinned real P002 revision
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-vtft-only"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_mode2_vtft_dcysusv_provenance.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp" \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-vtft-only-test"
          set +e
          "$RUNNER_TEMP/p003-dev-vtft-only-test"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_DEV_INCOMPLETE_VTFT_ONLY_SOURCE_SNAPSHOT_REPRODUCED sha=$DEV_SHA"
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_DEV_VTFT_ONLY_SOURCE_SNAPSHOT_PASS sha=$DEV_SHA"
          else
            echo "P003_DEV_VTFT_ONLY_UNEXPECTED_STATUS=$STATUS"
            exit 1
          fi
      - name: Verify authentic CCCA-only original source branch with explicit per-read validity
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I src/creative_compat \
            tests/p003_original_mode2_ccca_only_validated.cpp \
            src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp \
            src/creative_compat/CreativeVxdMonoVoiceRanking.cpp \
            -o "$RUNNER_TEMP/p003-research-ccca-only"
          "$RUNNER_TEMP/p003-research-ccca-only"
      - name: Reproduce verified CCCA-only source gap in pinned actual P002 developer code
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-ccca-only"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_mode2_ccca_only_validated.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp" \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-ccca-only-test"
          set +e
          "$RUNNER_TEMP/p003-dev-ccca-only-test"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_P002_HEAD_MISSING_CCCA_ONLY_PARTIAL_SNAPSHOT_REPRODUCED pinned_sha=$DEV_SHA"
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_P002_HEAD_CCCA_ONLY_PARTIAL_SNAPSHOT_PASS pinned_sha=$DEV_SHA"
          else
            echo "P003_P002_HEAD_CCCA_ONLY_UNEXPECTED_STATUS=$STATUS"
            exit 1
          fi
      - name: Reproduce mode2 original x86 high-marker skip against actual P002
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-mode2"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_mode2_high_marker_lazy_chip_read.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp" \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-mode2-test"
          set +e
          "$RUNNER_TEMP/p003-dev-mode2-test"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_MODE2_HIGH_MARKER_UNNECESSARY_LIVE_CHIP_READ_REPRODUCED pinned_sha=$DEV_SHA"
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_MODE2_ORIGINAL_HIGH_MARKER_SKIP_IMPLEMENTED pinned_sha=$DEV_SHA"
          else
            echo "P003_MODE2_UNEXPECTED_STATUS=$STATUS"
            exit 1
          fi
      - name: Inspect actual P002 developer commit read-only
        shell: bash
        run: |
          set -euo pipefail
          DEV_SHA=940098bd3e35f5b2b2b7c94ec9283b5b45067990
          git fetch --depth=1 origin "$DEV_SHA"
          DEV_ROOT="$RUNNER_TEMP/p003-dev-source"
          git worktree add --detach "$DEV_ROOT" FETCH_HEAD
          g++ -std=c++23 -O2 -Wall -Wextra -Werror \
            -I "$DEV_ROOT/src/creative_compat" \
            tests/p003_original_blocked_neighbor_previous_sentinel.cpp \
            "$DEV_ROOT/src/creative_compat/CreativeVxdAdditionalAllocatorModes.cpp" \
            "$DEV_ROOT/src/creative_compat/CreativeVxdMonoVoiceRanking.cpp" \
            -o "$RUNNER_TEMP/p003-dev-allocator"
          set +e
          "$RUNNER_TEMP/p003-dev-allocator"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 42 ]; then
            echo "P003_P002_HEAD_WRONG_PAIR_INDEPENDENTLY_REPRODUCED pinned_sha=$DEV_SHA"
            exit 0
          elif [ "$STATUS" -eq 0 ]; then
            echo "P003_P002_HEAD_PAIR_CORRECT pinned_sha=$DEV_SHA"
            exit 0
          else
            echo "P003_P002_HEAD_UNEXPECTED_STATUS=$STATUS"
            exit 1
          fi
