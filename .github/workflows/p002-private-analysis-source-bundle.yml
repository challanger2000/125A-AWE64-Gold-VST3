name: P002 source tools for private real Win95 trace and audio analysis
on:
  push:
    branches: [develop/p002-creative-register-oracle]
    paths: ['.github/workflows/p002-private-analysis-source-bundle.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  export_public_analysis_code_only:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source compile with no guest assets
        run: |
          python3 -m py_compile tools/p002_original_ram_trace_probe.py tools/p002_join_original_win95_ram_evidence.py tools/p002_verify_original_win95_ram_guest_log.py tools/p002_extract_original_win95_ram_log_fat16.py tools/p002_compare_original_dry_pcm.py
          echo 'P002_PRIVATE_ANALYSIS_PUBLIC_SOURCE_COMPILE_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: P002-PUBLIC-ANALYSIS-PYTHON-TOOLS
          path: |
            tools/p002_original_ram_trace_probe.py
            tools/p002_join_original_win95_ram_evidence.py
            tools/p002_verify_original_win95_ram_guest_log.py
            tools/p002_extract_original_win95_ram_log_fat16.py
            tools/p002_compare_original_dry_pcm.py
          retention-days: 2
          if-no-files-found: error
