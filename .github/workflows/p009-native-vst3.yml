name: P009 native AWE32Emu VST3 Windows (no Win95 VM)
on:
  push:
    branches: [research/awe32emu-native-isolated-20261120, feature/native-p165-complete-integration-20261120, fix/p173-sf2-live-switch-and-browser-origin-20261121, fix/p174-sample-ram-boundaries-stress-20261121, fix/p175-32voice-sustain-original-chip-20261121, fix/p176-rapid-sf2-swap-forward-progress-20261121, test/p177-adversarial-v5-state-parser-20261121, fix/p178-atomic-live-v5-owner-recall-20261121, test/p179-paced-original-chip-save-20261121, test/p180-sparse77-sf2-browser-audio-20261121, test/p181-owner-media-multirate-windows-vst3-20261121, integration/private-vst3-atomic-installer-20261121, fix/p185-codex-pr46-five-failures-20261121, fix/p186-codex-p185-no-go-20261121, fix/p187-p186-no-go-transaction-20261121, fix/p188-installer-crash-recovery-20261121, fix/p189-audit-corrections, fix/p192-sf2-sustain-default-20261122, audit/p193-sf2-originality-and-source-qa-20261122, fix/p194-creative-sf2-attack-default-20261122, fix/p195-creative-sf2-preset-generator-sums-20261122, fix/p196-creative-sf2-sample-end-offsets-20261122, fix/p197-original-creative-sf2-scale-tuning-20261122, fix/p198-original-creative-sf2-filter-register-conversion-20261122, fix/p199-original-sf2-stereo-linked-pair-20261122, fix/p200-original-creative-stereo-joint-trigger-20261122, fix/p201-original-stereo-adjacent-pair-allocation-20261122, fix/p202-emu8000-44100-double-render-cpu-20261122, fix/p203-creative-vxd-physical-voice-state-20261122, fix/p204-original-creative-reserve-all-before-voice-program-20261122, fix/p205-original-creative-allocator-vtft-reset-20261122, fix/p206-creative-original-cc120-cc123-sustain-20261122, fix/p207-creative-original-vxd-negative-pitch-saturation-20261122, fix/p208-neutral-125a-factory-metadata-20261122, fix/p209-owner-unequal-stereo-sf2-compat-20261122, test/p210-sf2-37-layer-32-voice-limit-20261122, test/p211-live-vst3-37-layer-recall-20261122, test/p212-original-creative-local-trace-parity-20261123, fix/p213-creative-sf2-converted-envelope-scopes-20261123, fix/p214-original-creative-sf2-decay-lfo-addresses-20261123, fix/p215-original-vxd-pcod-hold-sustain-20261123]
    paths:
      - ".github/workflows/p009-native-vst3.yml"
      - "research/native-awe32emu/p009-vst3/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p009-native:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Exact AWE32Emu reconstructed driver/core SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git init _p009-upstream
          git -C _p009-upstream remote add origin https://github.com/turican0/AWE32Emu.git
          git -C _p009-upstream fetch --depth 1 origin 17b0578fe59909dfaa784b5531d6d1a3a80729ce
          if($LASTEXITCODE -ne 0){throw 'upstream fetch error'}
          git -C _p009-upstream checkout --detach FETCH_HEAD
          $s=(git -C _p009-upstream rev-parse HEAD).Trim()
          if($s -ne '17b0578fe59909dfaa784b5531d6d1a3a80729ce'){throw 'wrong upstream SHA'}
      - name: Apply instance-local EMU8000 clock to pinned upstream checkout
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/apply_per_instance.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'original EMU8000 pin or clock patch mismatch'}
          Write-Host P009_NO_PROCESS_GLOBAL_WAVETABLE_CLOCK_PASS
      - name: Apply reviewed bounded memory/RT SoundFont patch (fail on upstream drift)
        shell: pwsh
        run: |
          git -C _p009-upstream apply --check "$env:GITHUB_WORKSPACE/research/native-awe32emu/p009-vst3/rt_safe.patch"
          if($LASTEXITCODE -ne 0){throw 'RT source patch does not match pinned upstream'}
          git -C _p009-upstream apply "$env:GITHUB_WORKSPACE/research/native-awe32emu/p009-vst3/rt_safe.patch"
          if($LASTEXITCODE -ne 0){throw 'RT source patch application failed'}
          Write-Host P009_BOUNDED_ORIGINAL_EMU8000_RT_SOURCE_PATCH_APPLIED_PASS
      - name: P019 permit diagnostic shorter chip windows ONLY in standalone probes
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p019_latency_window_probe.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P019 original pinned chip header window-override mismatch'}
          Write-Host P019_DEFAULT_WINDOW_REMAINS_ORIGINAL_980_FRAMES_PASS
      - name: P021 fix chip source for ALL host rates, not alternative DSP at 48 or 96k
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p021_box86_native_resampling.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P021 pinned original EMU8000 source fix mismatch'}
          Write-Host P021_GENUINE_BOX86_CHIP_AUDIO_ALL_SAMPLE_RATES_PATCHED
      - name: P202 remove discarded second synth at native 44.1k
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p202_skip_second_synth.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P202 pinned native-core 44.1k source changed'}
      - name: Import owner-approved P175 REAL 12 generator controls onto pinned original native chip
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/apply_p165_original_synth_overlays.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P165 original hardware-control pin/source mismatch'}
          Write-Host P165_ALL_12_REAL_ORIGINAL_CHIP_GENERATOR_OVERLAYS_PINNED
      - name: P192 fix SF2 missing sustain generators (SF1 ROM/SBK untouched)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p192_sf2_missing_sustain_default.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P192 SF2 sustain default patch refused pinned original source'}
      - name: P194 original Creative SF2 default Attack while preserving SF1/ROM
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p194_creative_sf2_attack_default.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P194 original SF2 attack default patch refused pinned source'}
      - name: P195 Creative SF2 linear-only preset merge (SF1 and nonlinear parameters untouched)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p195_creative_sf2_preset_additive.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P195 original Win95 SF2 additive merge patch refused pinned source'}
      - name: P196 original Creative SF2 sample-end address offsets (SF1 unaffected)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p196_creative_sf2_sample_end_offsets.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P196 genuine Creative sample-end offset patch refused pinned source'}
      - name: P197 original Creative SF2 cents-per-key scaleTuning (SF1 unchanged)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p197_creative_sf2_scale_tuning.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P197 original Creative SF2 scaleTuning patch refused pinned source'}
      - name: P198 original Creative SF2 converted-scope nonlinear Fc/Q
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p198_creative_sf2_filter_converted_scope.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P198 SF2 filter converted-scope patch refused pinned original'}
      - name: P199 SF2 linked stereo pair on original chip
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p199_creative_sf2_stereo_link.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P199 stereo patch refused pinned source'}
      - name: P209 accept owner-type SF2 linked stereo partners with independent lengths
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p209_sf2_allow_unequal_stereo_lengths.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P209 original 86Box SoundFont P199 source mismatch'}
      - name: P200 original Creative stereo joint DCYSUSV hardware trigger
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p200_original_stereo_joint_trigger.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P200 pinned original Creative stereo control patch mismatch'}
      - name: P201 original Creative adjacent physical stereo voice allocation
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p201_original_stereo_adjacent_pair.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P201 original VXD pair allocator patch refused pinned source'}
      - name: P203 original Creative physical voice count and paired allocator
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p203_vxd_physical_class.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P203 original VXD state patch mismatched pinned upstream'}
      - name: P204 original Creative SF2 reserve all physical voices before first main
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p204_original_vxd_batch_reserve.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P204 pinned original source/worklist mismatch'}
      - name: P205 original Creative VTFT allocator reset after physical stop
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p205_original_vxd_allocator_vtft.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P205 original Win95 allocator VTFT source mismatch'}
      - name: P206 original Win95 Creative CC120 CC123 pedal-aware channel release
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p206_original_win95_cc120_cc123.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P206 original VXD controller patch refused pinned source'}
      - name: P207 original Win95 unsigned bent IP saturation both NoteOn and live
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p207_original_vxd_negative_pitch_saturation.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P207 original VXD pitch implementation source mismatch'}
      - name: P210 retain fail-closed original 32-voice allocator; negative mutant is test-only
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p210_test_only_excess_voice_alias.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P210 source anchor missing or duplicate unsafe fallback'}
      - name: Apply independent original-chip drum audition channel
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/apply_p189_audition_channel.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P189 pinned Synth source mismatch'}
      - name: P212 actual Creative Win95 driver single allocator stop and SF2 VTFT
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p212_original_guest_no_duplicate_stop.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P212 original Creative Win95 guest register sequence mismatch'}
      - name: P213 original Creative SF2 converted envelope scopes (pin + fail closed)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p213_creative_sf2_converted_envelope_scopes.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P213 original Creative SF2 scope converter source pin mismatch'}
      - name: P214 original Creative Win95 SF2 preset decay / LFO / sample address (fail closed)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p214_original_creative_sf2_decay_lfo_addresses.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P214 source patch anchor or authentic Creative arithmetic mismatch'}
      - name: P215 original PCOD 65536-input x86 hold and Win95 SF2 sustain scopes
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p215_original_pcod_hold_sustain.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P215 original VXD PCOD SF2 source patch pin drift'}
      - name: Exact Steinberg VST3 SDK source
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git _p009-sdk
          if($LASTEXITCODE -ne 0){throw 'Steinberg SDK fetch failed'}
      - name: Build genuine native Windows x64 VST3 instrument
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S research/native-awe32emu/p009-vst3 -B _p009-build -G "Visual Studio 17 2022" -A x64 -DP009_SDK_ROOT="$env:GITHUB_WORKSPACE/_p009-sdk" -DP009_UPSTREAM="$env:GITHUB_WORKSPACE/_p009-upstream"
          if($LASTEXITCODE -ne 0){throw 'configure error'}
          cmake --build _p009-build --config Release --parallel 4 --target AWE64_Gold_Native_P009
          if($LASTEXITCODE -ne 0){throw 'native VST3 compilation failed'}
          $bundle='_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3'
          if(!(Test-Path $bundle)){throw "bundle missing"}
          $dll=Get-ChildItem -Path $bundle -Filter '*.vst3' -Recurse -File
          if(!$dll){throw 'actual VST3 DLL missing'}
          Write-Host P009_NATIVE_AWE32EMU_REAL_VST3_BUILT_NO_VM_PASS
      - name: P208 enforce neutral 125A brand, stable FUID and no personal account in compiled VST3
        shell: pwsh
        run: |
          $bundle='_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3'
          $module=Join-Path $bundle 'Contents/Resources/moduleinfo.json'
          $info=Get-Content -LiteralPath $module -Raw | ConvertFrom-Json
          if($info.Name -cne '125A-AWE64-Gold'){throw 'P208 incorrect publicly visible 125A plugin bundle identity'}
          if($info.'Factory Info'.Vendor -cne '125A Audio' -or $info.'Factory Info'.URL -cne ''){throw 'P208 factory vendor URL must have no personal GitHub namespace'}
          if($info.Classes.Count -ne 1 -or $info.Classes[0].CID -cne '125A8600F0094AEEB64A000000000901'){throw 'P208 existing host FUID must NOT change'}
          if($info.Classes[0].Name -cne '125A AWE64 Gold'){throw 'P208 original plugin display name changed'}
          $dll=Get-ChildItem -LiteralPath $bundle -Recurse -File | Where-Object { $_.Extension -eq '.vst3' } | Select-Object -First 1
          if(!$dll){throw 'P208 missing actual compiled native Windows DLL'}
          $text=[System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          $embedded=Get-Content -LiteralPath $module -Raw
          if($text -match '(?i)challanger2000|github[.]com/challanger2000' -or
             $embedded -match '(?i)challanger2000|github[.]com/challanger2000'){
              throw 'P208 compiled plugin leaks a personal GitHub account'
          }
          Write-Host P208_REAL_WIN64_VST3_COMPILED_DLL_FACTORY_AND_MODULEINFO_PERSONAL_IDENTITY_CLEAN_FUID_STABLE_PASS
      - name: Run Steinberg validator against VST3 without private ROM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target validator
          if($LASTEXITCODE -ne 0){throw 'Steinberg validator build error'}
          $v=Get-ChildItem -Path _p009-build -Filter validator.exe -Recurse -File | Where-Object {$_.FullName -match 'Release'} | Select-Object -First 1
          if(!$v){throw 'validator.exe not found'}
          $b=(Resolve-Path '_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3').Path
          $log='_p009-validator.log'
          & $v.FullName $b *> $log
          $rc=$LASTEXITCODE
          Get-Content $log | Select-Object -Last 25
          if($rc -ne 0){throw "Steinberg validator exited with $rc"}
          if(!(Select-String -Path $log -Pattern 'Result: +47 tests passed, 0 tests failed' -Quiet)){throw '47/47 validator summary missing'}
          Write-Host P009_REAL_STEINBERG_47_OF_47_VALIDATOR_WITH_NO_ROM_AUDIO_PASS
      - name: Two simultaneous same-process native synths AND DAW thread migration (synthetic test ROM)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P009NativeInstanceProbe
          if($LASTEXITCODE -ne 0){throw 'native parallel-instance harness build failed'}
          $fake='_p009-fake-rom-only.raw'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          for($i=0;$i -lt 4;$i++){
            & _p009-build/Release/P009NativeInstanceProbe.exe $fake
            if($LASTEXITCODE -ne 0){throw "PCM race at simultaneous run $i"}
          }
          Remove-Item $fake
          Write-Host P009_WINDOWS_4X_PARALLEL_AND_DAW_WORKER_MIGRATION_PASS_NO_PRIVATE_ROM
      - name: Audio/MIDI callback HEAP = ZERO at 8/44.1/48/96/192k incl 2-layer SF2 and 2 parallel synths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P009RealtimeAllocationProbe
          if($LASTEXITCODE -ne 0){throw 'RT alloc probe build failed'}
          $fake='_p009-fake-rom-rt-only.raw'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          & _p009-build/Release/P009RealtimeAllocationProbe.exe $fake
          $rc=$LASTEXITCODE
          if($rc -ne 0){throw 'RT fallback-MIDI C++ allocation test failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py _p009-two-layer-test.sf2
          if($LASTEXITCODE -ne 0){throw 'generated SF2 failed'}
          & _p009-build/Release/P009RealtimeAllocationProbe.exe $fake _p009-two-layer-test.sf2
          $rc=$LASTEXITCODE
          Remove-Item $fake
          Remove-Item _p009-two-layer-test.sf2
          if($rc -ne 0){throw 'REAL two-layer SF2 lookup C++ allocation test failed'}
          Write-Host P009_RT_WINDOWS_5_RATES_2_CONCURRENT_INSTANCES_REAL_LAYERS_ZERO_HEAP_PASS
      - name: P202 real original chip old/new PCM and same-Windows-runner CPU p95 p99 max
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P202CpuLegacy P202CpuOptimized
          if($LASTEXITCODE -ne 0){throw 'P202 paired original 86Box chip programs compilation failed'}
          $rom='_p202-public-rom.raw'
          $sf2='_p202-public-sustain.sf2'
          [IO.File]::WriteAllBytes((Join-Path $PWD $rom),(New-Object byte[] 1048576))
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sf2 --sustain
          if($LASTEXITCODE -ne 0){throw 'P202 independent positive audio fixture unavailable'}
          $denseImprovement=0
          foreach($iteration in @(1,2)){
            & _p009-build/Release/P202CpuLegacy.exe $rom $sf2 > "_p202-legacy-$iteration.json"
            if($LASTEXITCODE -ne 0){throw "P202 old native original-chip PCM probe failed: $iteration"}
            & _p009-build/Release/P202CpuOptimized.exe $rom $sf2 > "_p202-optimized-$iteration.json"
            if($LASTEXITCODE -ne 0){throw "P202 candidate actual original-chip PCM probe failed: $iteration"}
            $old=Get-Content "_p202-legacy-$iteration.json" -Raw | ConvertFrom-Json
            $new=Get-Content "_p202-optimized-$iteration.json" -Raw | ConvertFrom-Json
            if($old.cases.Count -ne 8 -or $new.cases.Count -ne 8){
               throw 'P202 all eight independent genuine-chip 44.1/48k cases required'}
            for($i=0;$i -lt 8;$i++){
               $a=$old.cases[$i];$b=$new.cases[$i]
               if($a.rate -ne $b.rate -or $a.block -ne $b.block -or
                  $a.notes -ne $b.notes -or $a.samples -ne $b.samples -or
                  $a.hash -ne $b.hash -or $a.energy -ne $b.energy -or $a.energy -eq 0){
                  throw "P202 chip PCM altered or false-positive test case iteration=$iteration case=$i"
               }
               $ratio=[double]$b.p95_us/[Math]::Max(0.001,[double]$a.p95_us)
               Write-Host ("P202_REAL_CHIP_CPU rate={0} block={1} notes={2} old_p95_us={3} new_p95_us={4} p95_ratio={5:N4} old_p99_us={6} new_p99_us={7} old_max_us={8} new_max_us={9} old_overruns={10} new_overruns={11} chip_pcm_hash={12}" -f $a.rate,$a.block,$a.notes,$a.p95_us,$b.p95_us,$ratio,$a.p99_us,$b.p99_us,$a.max_us,$b.max_us,$a.overruns,$b.overruns,$a.hash)
               if($a.rate -eq 44100 -and $a.notes -eq 16 -and $ratio -lt 0.90){
                  $denseImprovement++
               }
            }
          }
          if($denseImprovement -lt 2){throw 'P202 requires at least two repeatable dense 44.1k p95 improvements >10%'}
          & _p009-build/Release/P202CpuOptimized.exe $rom $sf2 --mutate-audio > _p202-mutant.json
          if($LASTEXITCODE -ne 0){throw 'P202 test-only altered PCM failed to execute'}
          $mutant=Get-Content _p202-mutant.json -Raw | ConvertFrom-Json
          $reference=Get-Content _p202-optimized-2.json -Raw | ConvertFrom-Json
          for($i=0;$i -lt 8;$i++){
             if($mutant.cases[$i].hash -eq $reference.cases[$i].hash){
                throw "P202 PCM hash oracle failed to detect test mutant case=$i"
             }
          }
          Remove-Item $rom,$sf2 -Force
          Write-Host P202_8_REAL_CHIP_CASES_2_REPEATS_EXACT_PCM_44100_CPU_P95_REDUCED_NEGATIVE_KILLED_PASS
      - name: P203 original physical 32-voice VXD state positive and bad-protection mutant
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P203VoiceStateNative P203VoiceStateNegative
          if($LASTEXITCODE -ne 0){throw 'P203 actual native chip test compiler failed'}
          $fake='_p203-public-rom.raw'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake),(New-Object byte[] 1048576))
          & _p009-build/Release/P203VoiceStateNative.exe $fake > _p203-native.txt
          if($LASTEXITCODE -ne 0){Get-Content _p203-native.txt;throw 'P203 original mode1 positive failed'}
          Get-Content _p203-native.txt
          if(!(Select-String -Path _p203-native.txt -Pattern 'P203_REAL_ORIGINAL_86BOX_VXD_SIX_CASES_PASS' -Quiet)){throw 'P203 missing live original-chip positive'}
          & _p009-build/Release/P203VoiceStateNegative.exe $fake > _p203-negative.txt 2>&1
          $badCode=$LASTEXITCODE
          Get-Content _p203-negative.txt
          if($badCode -eq 0){throw 'P203 old wrong-mode mutant passed an inadequate test'}
          if(!(Select-String -Path _p203-negative.txt -Pattern 'P203_VXD_MODE1_FAIL' -Quiet)){throw 'P203 mutant failed unrelated fixture'}
          # The mutant deliberately exited nonzero: after checking its
          # EXPECTED failure, clear PowerShell's inherited native exit status.
          # Otherwise pwsh returns 1 after the final Write-Host despite
          # every P203 oracle having passed (Actions #45052209746).
          $global:LASTEXITCODE=0
          Remove-Item $fake -Force
          Write-Host P203_REAL_86BOX_ORIGINAL_CLASS_MODE1_PAIR_6_POSITIVE_NEGATIVE_PASS
      - name: P016 original EMU8000 chip non-silent PUBLIC SF2 PCM recall parity with negative controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P016PublicRecallPCM
          if($LASTEXITCODE -ne 0){throw 'P016 original-core parity harness compile failed'}
          $fake='_p016-fake-rom-only.raw'
