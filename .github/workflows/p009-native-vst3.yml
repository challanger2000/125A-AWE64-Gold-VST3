          $helper=(Resolve-Path '_p009-tester-v033-build/Release/125A_Plugin_Tester_Single.exe').Path
          if(-not (Test-Path $helper)){throw 'P170 0.3.3 actual isolated dispatcher helper absent'}
          $plugin=(Resolve-Path '_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3').Path
          $resource=Join-Path $plugin 'Contents/Resources/P009-Private'
          New-Item -ItemType Directory -Force -Path $resource | Out-Null
          $rom=Join-Path $resource 'awe32.raw'
          $sbk=Join-Path $resource 'SYNTHGM.SBK'
          $sf2=Join-Path $resource 'user.sf2'
          $evidence=Join-Path $env:GITHUB_WORKSPACE '_p009-tester-v033-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:125A_PLUGIN_TESTER_REPORT_DIR=$evidence
          $stdOut=Join-Path $evidence 'P170_v033_stdout.log'
          $stdErr=Join-Path $evidence 'P170_v033_stderr.log'
          try {
            [IO.File]::WriteAllBytes($rom,(New-Object byte[] 1048576))
            python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sbk --wet
            if($LASTEXITCODE -ne 0){throw 'P170 synthetic Creative bank generation failed'}
            python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sf2 --expressive
            if($LASTEXITCODE -ne 0){throw 'P170 synthetic user expressive bank generation failed'}
            # This executable is the real CONSOLE dispatcher, unlike the
            # released v0.2.10 portable GUI stub. Wait on its actual process.
            $child=Start-Process -FilePath $exe -ArgumentList ('"'+$plugin+'"') -WorkingDirectory (Split-Path -Parent $exe) -Wait -PassThru -RedirectStandardOutput $stdOut -RedirectStandardError $stdErr
            $rc=$child.ExitCode
            Write-Host "P170_REAL_WINDOWS_V033_DISPATCH_EXIT_CODE=$rc"
            if(Test-Path $stdOut){Get-Content $stdOut | Select-Object -Last 45}
            if(Test-Path $stdErr){Get-Content $stdErr | Select-Object -Last 45}
            $reports=@(Get-ChildItem -LiteralPath $evidence -File)
            $qa=@($reports | Where-Object {$_.Name -like 'AWE64_Gold_Native_P009_*_125A_QA_Report.txt'})
            $json=@($reports | Where-Object {$_.Name -like 'AWE64_Gold_Native_P009_*_125A_QA_Report.json'})
            if($qa.Count -ne 1 -or $json.Count -ne 1){
              throw "P170 expected one 125A v0.3.3 QA TXT and JSON; got TXT=$($qa.Count), JSON=$($json.Count)"
            }
            $result=Get-Content -Raw -LiteralPath $qa[0].FullName
            $machine=Get-Content -Raw -LiteralPath $json[0].FullName | ConvertFrom-Json
            $summary=@([regex]::Matches($result,'(?m)^RESULT: ([0-9]+) PASS / ([0-9]+) WARNING / ([0-9]+) FAIL'))
            if($summary.Count -ne 1){throw 'P170 real v0.3.3 tester did not write one machine-checkable verdict'}
            Write-Host "P170_125A_V033_VERDICT $($summary[0].Value)"
            Write-Host "P170_125A_V033_JSON status=$($machine.status) testerVersion=$($machine.testerVersion) sourceSHA=$sha"
            Get-Content $qa[0].FullName | Select-Object -Last 45
            if($rc -ne 0){throw "P170 125A v0.3.3 real dispatcher returned $rc"}
            if($machine.testerVersion -ne '0.3.3' -or $machine.status -ne 'PASS'){
              throw 'P170 v0.3.3 actual QA JSON verdict is not PASS'
            }
            if($summary[0].Groups[2].Value -ne '0' -or $summary[0].Groups[3].Value -ne '0'){
              throw 'P170 new v0.3.3 tester reported warnings or failures: investigate'
            }
            Write-Host "::notice title=125A Plugin Tester v0.3.3::$($summary[0].Value)"
            Write-Host 'P170_ACTUAL_WINDOWS_125A_TESTER_V033_ZERO_WARNING_ZERO_FAILURE_GENUINE_VST3_PASS'
          } finally {
            Remove-Item -LiteralPath $rom,$sbk,$sf2 -Force -ErrorAction SilentlyContinue
          }
      - name: Two native EditorHost views of one controller with master readback
        if: ${{ !cancelled() && steps.p165_editor.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $editor=(Get-ChildItem _p009-build -Filter editorhost.exe -Recurse -File |
            Where-Object {$_.FullName -match 'Release'} |
            Select-Object -First 1 -ExpandProperty FullName)
          if(!$editor){throw 'Steinberg EditorHost executable not found'}
          $plugin=(Resolve-Path '_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3').Path
          python research/native-awe32emu/p009-vst3/tests/P165NativeEditorHostQA.py --editorhost $editor --plugin $plugin --multiple --output _awe64-peer-editor-evidence *> _p009-host-editors.log
          $rc=$LASTEXITCODE
          Get-Content _p009-host-editors.log
          if($rc -ne 0){
            $last=Get-Content _p009-host-editors.log -Tail 1
            Write-Host "::error title=P010 multiple editors regression::Exit ${rc}. $last"
            throw "Steinberg EditorHost two-view test failed: $rc"
          }
          $env:P184_EDITOR_REOPEN='1'
          try {
            python research/native-awe32emu/p009-vst3/tests/P184NativeEditorLifecycleQA.py --editorhost $editor --plugin $plugin --output _p184-editor-lifecycle-evidence *> _p184-editor-lifecycle.log
            $p184rc=$LASTEXITCODE
            Get-Content _p184-editor-lifecycle.log
            if($p184rc -ne 0){throw "P184 real native editor lifecycle test failed: $p184rc"}
            if(!(Select-String -Path _p184-editor-lifecycle.log -SimpleMatch -Pattern 'P184_ACTUAL_WINDOWS_EDITOR_CLOSE_REOPEN_PEER_SURVIVAL_PASS' -Quiet)){
              throw 'P184 missing real two-editor close/reopen output'
            }
          } finally {
            Remove-Item Env:P184_EDITOR_REOPEN -ErrorAction SilentlyContinue
          }
      - name: P189 native Win64 installer verifies interrupted backup and target integrity
        shell: pwsh
        timeout-minutes: 7
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/native-awe32emu/p009-vst3/packaging/P182-Windows-Installer-QA.ps1 *> _p189-installer.log
          $installerRc=$LASTEXITCODE
          Get-Content _p189-installer.log
          if($installerRc -ne 0){throw 'P182 actual Windows installer QA did not complete'}
          foreach($variant in @('BACKUP','TARGET')) {
            $marker="P189_NATIVE_INTERRUPTED_${variant}_INTEGRITY_FAIL_CLOSED_PASS"
            if(!(Select-String -Path _p189-installer.log -SimpleMatch -Pattern $marker -Quiet)){
              throw "Missing native Windows installer gate: $marker"
            }
            Write-Host ("::notice title=P189 native installer QA::$marker")
          }
          Write-Host P182_WINDOWS_PRIVATE_PACKAGE_INSTALL_INTEGRITY_ROLLBACK_PASS
          Write-Host P188_WINDOWS_FORCED_PROCESS_KILL_VERIFIED_IN_INSTALLER_QA
