name: P009 native AWE32Emu VST3 Windows (no Win95 VM)
on:
  push:
    branches: [research/awe32emu-native-isolated-20261120, feature/native-p165-complete-integration-20261120, fix/p173-sf2-live-switch-and-browser-origin-20261121, fix/p174-sample-ram-boundaries-stress-20261121, fix/p175-32voice-sustain-original-chip-20261121, fix/p176-rapid-sf2-swap-forward-progress-20261121, test/p177-adversarial-v5-state-parser-20261121, fix/p178-atomic-live-v5-owner-recall-20261121, test/p179-paced-original-chip-save-20261121, test/p180-sparse77-sf2-browser-audio-20261121, test/p181-owner-media-multirate-windows-vst3-20261121, integration/private-vst3-atomic-installer-20261121, fix/p185-codex-pr46-five-failures-20261121, fix/p186-codex-p185-no-go-20261121, fix/p187-p186-no-go-transaction-20261121, fix/p188-installer-crash-recovery-20261121, fix/p189-audit-corrections, fix/p192-sf2-sustain-default-20261122, audit/p193-sf2-originality-and-source-qa-20261122, fix/p194-creative-sf2-attack-default-20261122, fix/p195-creative-sf2-preset-generator-sums-20261122, fix/p196-creative-sf2-sample-end-offsets-20261122, fix/p197-original-creative-sf2-scale-tuning-20261122]
    paths:
      - ".github/workflows/p009-native-vst3.yml"
      - "research/native-awe32emu/p009-vst3/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p009-native:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Exact AWE32Emu reconstructed driver/core SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git init _p009-upstream
          git -C _p009-upstream remote add origin https://github.com/turican0/AWE32Emu.git
          git -C _p009-upstream fetch --depth 1 origin 17b0578fe59909dfaa784b5531d6d1a3a80729ce
          if($LASTEXITCODE -ne 0){throw 'upstream fetch error'}
          git -C _p009-upstream checkout --detach FETCH_HEAD
          $s=(git -C _p009-upstream rev-parse HEAD).Trim()
          if($s -ne '17b0578fe59909dfaa784b5531d6d1a3a80729ce'){throw 'wrong upstream SHA'}
      - name: Apply instance-local EMU8000 clock to pinned upstream checkout
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/apply_per_instance.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'original EMU8000 pin or clock patch mismatch'}
          Write-Host P009_NO_PROCESS_GLOBAL_WAVETABLE_CLOCK_PASS
      - name: Apply reviewed bounded memory/RT SoundFont patch (fail on upstream drift)
        shell: pwsh
        run: |
          git -C _p009-upstream apply --check "$env:GITHUB_WORKSPACE/research/native-awe32emu/p009-vst3/rt_safe.patch"
          if($LASTEXITCODE -ne 0){throw 'RT source patch does not match pinned upstream'}
          git -C _p009-upstream apply "$env:GITHUB_WORKSPACE/research/native-awe32emu/p009-vst3/rt_safe.patch"
          if($LASTEXITCODE -ne 0){throw 'RT source patch application failed'}
          Write-Host P009_BOUNDED_ORIGINAL_EMU8000_RT_SOURCE_PATCH_APPLIED_PASS
      - name: P019 permit diagnostic shorter chip windows ONLY in standalone probes
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p019_latency_window_probe.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P019 original pinned chip header window-override mismatch'}
          Write-Host P019_DEFAULT_WINDOW_REMAINS_ORIGINAL_980_FRAMES_PASS
      - name: P021 fix chip source for ALL host rates, not alternative DSP at 48 or 96k
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p021_box86_native_resampling.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P021 pinned original EMU8000 source fix mismatch'}
          Write-Host P021_GENUINE_BOX86_CHIP_AUDIO_ALL_SAMPLE_RATES_PATCHED
      - name: Import owner-approved P175 REAL 12 generator controls onto pinned original native chip
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/apply_p165_original_synth_overlays.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P165 original hardware-control pin/source mismatch'}
          Write-Host P165_ALL_12_REAL_ORIGINAL_CHIP_GENERATOR_OVERLAYS_PINNED
      - name: P192 fix SF2 missing sustain generators (SF1 ROM/SBK untouched)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p192_sf2_missing_sustain_default.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P192 SF2 sustain default patch refused pinned original source'}
      - name: P194 original Creative SF2 default Attack while preserving SF1/ROM
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p194_creative_sf2_attack_default.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P194 original SF2 attack default patch refused pinned source'}
      - name: P195 Creative SF2 linear-only preset merge (SF1 and nonlinear parameters untouched)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p195_creative_sf2_preset_additive.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P195 original Win95 SF2 additive merge patch refused pinned source'}
      - name: P196 original Creative SF2 sample-end address offsets (SF1 unaffected)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p196_creative_sf2_sample_end_offsets.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P196 genuine Creative sample-end offset patch refused pinned source'}
      - name: P197 original Creative SF2 cents-per-key scaleTuning (SF1 unchanged)
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/p197_creative_sf2_scale_tuning.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P197 original Creative SF2 scaleTuning patch refused pinned source'}
      - name: Apply independent original-chip drum audition channel
        shell: pwsh
        run: |
          python research/native-awe32emu/p009-vst3/apply_p189_audition_channel.py _p009-upstream
          if($LASTEXITCODE -ne 0){throw 'P189 pinned Synth source mismatch'}
      - name: Exact Steinberg VST3 SDK source
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git _p009-sdk
          if($LASTEXITCODE -ne 0){throw 'Steinberg SDK fetch failed'}
      - name: Build genuine native Windows x64 VST3 instrument
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S research/native-awe32emu/p009-vst3 -B _p009-build -G "Visual Studio 17 2022" -A x64 -DP009_SDK_ROOT="$env:GITHUB_WORKSPACE/_p009-sdk" -DP009_UPSTREAM="$env:GITHUB_WORKSPACE/_p009-upstream"
          if($LASTEXITCODE -ne 0){throw 'configure error'}
          cmake --build _p009-build --config Release --parallel 4 --target AWE64_Gold_Native_P009
          if($LASTEXITCODE -ne 0){throw 'native VST3 compilation failed'}
          $bundle='_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3'
          if(!(Test-Path $bundle)){throw "bundle missing"}
          $dll=Get-ChildItem -Path $bundle -Filter '*.vst3' -Recurse -File
          if(!$dll){throw 'actual VST3 DLL missing'}
          Write-Host P009_NATIVE_AWE32EMU_REAL_VST3_BUILT_NO_VM_PASS
      - name: Run Steinberg validator against VST3 without private ROM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target validator
          if($LASTEXITCODE -ne 0){throw 'Steinberg validator build error'}
          $v=Get-ChildItem -Path _p009-build -Filter validator.exe -Recurse -File | Where-Object {$_.FullName -match 'Release'} | Select-Object -First 1
          if(!$v){throw 'validator.exe not found'}
          $b=(Resolve-Path '_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3').Path
          $log='_p009-validator.log'
          & $v.FullName $b *> $log
          $rc=$LASTEXITCODE
          Get-Content $log | Select-Object -Last 25
          if($rc -ne 0){throw "Steinberg validator exited with $rc"}
          if(!(Select-String -Path $log -Pattern 'Result: +47 tests passed, 0 tests failed' -Quiet)){throw '47/47 validator summary missing'}
          Write-Host P009_REAL_STEINBERG_47_OF_47_VALIDATOR_WITH_NO_ROM_AUDIO_PASS
      - name: Two simultaneous same-process native synths AND DAW thread migration (synthetic test ROM)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P009NativeInstanceProbe
          if($LASTEXITCODE -ne 0){throw 'native parallel-instance harness build failed'}
          $fake='_p009-fake-rom-only.raw'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          for($i=0;$i -lt 4;$i++){
            & _p009-build/Release/P009NativeInstanceProbe.exe $fake
            if($LASTEXITCODE -ne 0){throw "PCM race at simultaneous run $i"}
          }
          Remove-Item $fake
          Write-Host P009_WINDOWS_4X_PARALLEL_AND_DAW_WORKER_MIGRATION_PASS_NO_PRIVATE_ROM
      - name: Audio/MIDI callback HEAP = ZERO at 8/44.1/48/96/192k incl 2-layer SF2 and 2 parallel synths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P009RealtimeAllocationProbe
          if($LASTEXITCODE -ne 0){throw 'RT alloc probe build failed'}
          $fake='_p009-fake-rom-rt-only.raw'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          & _p009-build/Release/P009RealtimeAllocationProbe.exe $fake
          $rc=$LASTEXITCODE
          if($rc -ne 0){throw 'RT fallback-MIDI C++ allocation test failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py _p009-two-layer-test.sf2
          if($LASTEXITCODE -ne 0){throw 'generated SF2 failed'}
          & _p009-build/Release/P009RealtimeAllocationProbe.exe $fake _p009-two-layer-test.sf2
          $rc=$LASTEXITCODE
          Remove-Item $fake
          Remove-Item _p009-two-layer-test.sf2
          if($rc -ne 0){throw 'REAL two-layer SF2 lookup C++ allocation test failed'}
          Write-Host P009_RT_WINDOWS_5_RATES_2_CONCURRENT_INSTANCES_REAL_LAYERS_ZERO_HEAP_PASS
      - name: P016 original EMU8000 chip non-silent PUBLIC SF2 PCM recall parity with negative controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P016PublicRecallPCM
          if($LASTEXITCODE -ne 0){throw 'P016 original-core parity harness compile failed'}
          $fake='_p016-fake-rom-only.raw'
          $sf2='_p016-public-two-layer.sf2'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sf2
          if($LASTEXITCODE -ne 0){throw 'P016 public SF2 fixture generation failed'}
          & _p009-build/Release/P016PublicRecallPCM.exe $fake $sf2 *> _p016-public-recall-pcm.log
          $rc=$LASTEXITCODE
          Get-Content _p016-public-recall-pcm.log
          Remove-Item $fake,$sf2 -ErrorAction SilentlyContinue
          if($rc -ne 0){throw "P016 genuine EMU8000 SF2 recall PCM parity failed: $rc"}
          $cases=@(Select-String -Path _p016-public-recall-pcm.log -Pattern '^P016_PUBLIC_REAL_EMU8000_SF2_RECALL_PCM_PARITY_PASS')
          if($cases.Count -ne 6){throw "P016 needs six comparisons; got $($cases.Count)"}
          Write-Host P016_PUBLIC_ORIGINAL_CHIP_SYNTHETIC_SF2_RECALL_PCM_NEGATIVE_CONTROLS_PASS
      - name: P019 compare real chip dry and FX PCM at 980 128 64 sample windows (experiment)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P019Probe980 P019Probe128 P019Probe64 P019ComparePCM
          if($LASTEXITCODE -ne 0){throw 'P019 chip window probes compilation failed'}
          $fake='_p019-fake-rom-only.raw'
          $sf2='_p019-public-two-layer.sf2'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sf2
          if($LASTEXITCODE -ne 0){throw 'P019 synthetic SF2 construction failed'}
          foreach($mode in @('dry','fx')){
            foreach($window in @(980,128,64)){
              $exe="_p009-build/Release/P019Probe$window.exe"
              $output="_p019-$mode-$window.pcm"
              & $exe $fake $sf2 $mode $output
              if($LASTEXITCODE -ne 0){throw "P019 original-chip PCM probe failed: mode=$mode window=$window"}
            }
          }
          python research/native-awe32emu/p009-vst3/tests/p019_compare_pcm.py _p019-dry-980.pcm _p019-dry-128.pcm _p019-dry-64.pcm _p019-fx-980.pcm _p019-fx-128.pcm _p019-fx-64.pcm _p019-latency-report.json _p019-latency-report.txt
          if($LASTEXITCODE -ne 0){throw 'P019 original chip PCM comparison failed'}
          Get-Content _p019-latency-report.txt
          foreach($mode in @('dry','fx')){
            foreach($window in @(128,64)){
              & _p009-build/Release/P019ComparePCM.exe "_p019-$mode-980.pcm" "_p019-$mode-$window.pcm" "$window" "$mode-public"
              if($LASTEXITCODE -ne 0){throw "P019 Win64 native PCM comparator mismatch, $mode/$window"}
            }
          }
          $lines=@(Select-String -Path _p019-latency-report.txt -Pattern '^P019_(DRY|FX)_WINDOW(128|64)_PCM=')
          if($lines.Count -ne 4){throw 'P019 four shortened-window comparison results missing'}
          Remove-Item $fake,$sf2 -ErrorAction SilentlyContinue
          $tokens=$null
          $parseErrors=$null
          $script=Join-Path $env:GITHUB_WORKSPACE 'research/native-awe32emu/p009-vst3/tests/RUN-P019-OWNER.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -gt 0){throw "P019 owner offline launcher PowerShell syntax error: $parseErrors"}
          Write-Host P019_PRIVATE_OWNER_WINDOWS_SCRIPT_SYNTAX_PASS
          Write-Host P019_EXPERIMENT_ONLY_PRODUCTION_STAYS_980_FRAMES_PASS
      - name: P021 prove authentic 86Box chip PCM at 8 48 96 192k vs 44100 reference, dry plus FX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P021OriginalChipResamplingProbe
          if($LASTEXITCODE -ne 0){throw 'P021 authentic chip native-rate reference harness compile failed'}
          $fake='_p021-fake-rom-only.raw'
          $sf2='_p021-public-two-layer.sf2'
          [IO.File]::WriteAllBytes((Join-Path $PWD $fake), (New-Object byte[] 1048576))
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sf2
          if($LASTEXITCODE -ne 0){throw 'P021 public 2-layer SF2 generation failed'}
          & _p009-build/Release/P021OriginalChipResamplingProbe.exe $fake $sf2 *> _p021-original-chip-multirate.log
          $rc=$LASTEXITCODE
          Get-Content _p021-original-chip-multirate.log
          Remove-Item $fake,$sf2 -ErrorAction SilentlyContinue
          if($rc -ne 0){throw "P021 86Box chip rate source mismatch or silent original chip: $rc"}
          $cases=@(Select-String -Path _p021-original-chip-multirate.log -Pattern '^P021_ORIGINAL_BOX86_CHIP_RESAMPLER_(DRY|FX) rate=')
          if($cases.Count -ne 8){throw "P021 expected eight authentic chip rate comparisons, got $($cases.Count)"}
          $equalDuration=@(Select-String -Path _p021-original-chip-multirate.log -Pattern '^P022_OWNER_ORIGINAL_CHIP_RATE_WINDOW_(DRY|FX) rate=(8000|48000|96000|192000) duration_ms=750 ')
          if($equalDuration.Count -ne 8){throw "P022 must test 750 ms of each of eight original chip signals, got $($equalDuration.Count)"}
          if(!(Select-String -Path _p021-original-chip-multirate.log -Pattern '^P022_EQUAL_750MS_ALL_RATES_GENUINE_CHIP_PCM_PASS_8_OF_8' -Quiet)){throw 'P022 corrected equal-duration 8/8 original-chip PCM evidence missing'}
          if(!(Select-String -Path _p021-original-chip-multirate.log -Pattern '^P021_ALL_RATES_GENUINE_86BOX_EMU8000_PCM_FROM_NATIVE_44100_PASS_8_OF_8' -Quiet)){throw 'P021 chip reference proof missing'}
          Write-Host P021_BOX86_ORIGINAL_PCM_ALL_8_48_96_192K_TRULY_86BOX_PASS
      - name: P010 ACTUAL Steinberg Windows native VST3 host checks public silence
        id: p010_public
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build _p009-build --config Release --parallel 4 --target P010NativeHostQA
          if($LASTEXITCODE -ne 0){throw 'P010 actual VST3 host compile failed'}
          $bundle='_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3'
          & _p009-build/Release/P010NativeHostQA.exe $bundle --public *> _p009-host-public.log
          $rc=$LASTEXITCODE
          Get-Content _p009-host-public.log
          if($rc -ne 0){
            $last=Get-Content _p009-host-public.log -Tail 1
            Write-Host "::error title=P010 public host regression::Exit ${rc}. $last"
            throw "P010 public VST3 host contracts failed: $rc"
          }
          Write-Host P010_REAL_NATIVE_WINDOWS_VST3_HOST_NO_ROM_SILENCE_ONLY_PASS
      - name: Actual native Win64 VST3 synthetic original 86Box chip V5 external SF2 SHA and PCM end-to-end
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle='_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3'
          $dir=Join-Path $bundle 'Contents/Resources/P009-Private'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'awe32.raw'),(New-Object byte[] 1048576))
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'SYNTHGM.SBK') --wet
          if($LASTEXITCODE -ne 0){throw 'synthetic original Creative base-bank fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'vintage.sf2') --wet
          if($LASTEXITCODE -ne 0){throw 'synthetic selected Vintage SoundFont fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir '77-presets.sf2') --alternate --wet
          if($LASTEXITCODE -ne 0){throw 'synthetic deliberately different alternate SF2 fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'sustain.sf2') --sustain
          if($LASTEXITCODE -ne 0){throw 'synthetic sustained loop SF2 fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'sustain-explicit.sf2') --sustain
          if($LASTEXITCODE -ne 0){throw 'P192 explicit 0-cB sustain SF2 generation failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'sustain-implicit.sf2') --omit-sustain
          if($LASTEXITCODE -ne 0){throw 'P192 omitted sustain SF2 generation failed'}
          python research/native-awe32emu/p009-vst3/tests/P193AttackDefaultPair.py $dir
          if($LASTEXITCODE -ne 0){throw 'P194 SF2 attack-equivalent pair generation failed'}
          python research/native-awe32emu/p009-vst3/tests/P195PresetMergePair.py $dir
          if($LASTEXITCODE -ne 0){throw 'P195 genuine Creative additive SF2 fixture generation failed'}
          python research/native-awe32emu/p009-vst3/tests/P196CreativeEndOffsetPair.py $dir
          if($LASTEXITCODE -ne 0){throw 'P196 independent SF2 sample-end fixture generation failed'}
          python research/native-awe32emu/p009-vst3/tests/P197CreativeScaleTuningPair.py $dir
          if($LASTEXITCODE -ne 0){throw 'P197 original SF2 key tracking fixture generation failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'expressive.sf2') --expressive
          if($LASTEXITCODE -ne 0){throw 'synthetic genuinely expressive original-chip SF2 fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'drums.sf2') --expressive --drums
          if($LASTEXITCODE -ne 0){throw 'synthetic sustained drum bank fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'multi-drums.sf2') --drums --drum-kits
          if($LASTEXITCODE -ne 0){throw 'P185 genuine two-kit stereo PCM counterexample fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'multi-drums-sustain.sf2') --drums --drum-kits --sustain
          if($LASTEXITCODE -ne 0){throw 'P186 independent looped two-NoteID drum fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'oversized.sf2') --oversized
          if($LASTEXITCODE -ne 0){throw 'P171 oversized SF2 generator failed'}
          # EMU8000 chip RAM: 28 MiB=14680064 sample words. Original Win95
          # 16-word reserve, this SBK contains 1536 PCM words + 8 guard,
          # and the user SF2 adds 8 guard. Exact user words=14678496.
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'exact-fit.sf2') --sample-words=14678496
          if($LASTEXITCODE -ne 0){throw 'P174 exact physical 28 MiB fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'one-word-over.sf2') --sample-words=14678497
          if($LASTEXITCODE -ne 0){throw 'P174 one sample word over physical RAM fixture failed'}
          python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py (Join-Path $dir 'voice32.sf2') --sustain --single
          if($LASTEXITCODE -ne 0){throw 'P175 one-zone looping SF2 for 32 original chip voices missing'}
          python research/native-awe32emu/p009-vst3/tests/make_public_sparse77_sf2.py (Join-Path $dir 'sparse77.sf2')
          if($LASTEXITCODE -ne 0){throw 'P180 public sparse 77-preset SF2 generator failed'}
          # Independent C++20 SF2 browser test: never compile Steinberg's
          # module_win32.cpp as C++20 merely to use std::span in the catalog.
          cmake --build _p009-build --config Release --parallel 4 --target P173BrowserContract
          if($LASTEXITCODE -ne 0){throw 'P173 browser-only C++20 contract build failed'}
          & _p009-build/Release/P173BrowserContract.exe $dir *> _p173-browser-contract.log
          $browserRc=$LASTEXITCODE
          Get-Content _p173-browser-contract.log
          if($browserRc -ne 0){throw "P173/P180/P183 browser source contract failed: $browserRc"}
          if(!(Select-String -Path _p173-browser-contract.log -SimpleMatch -Pattern 'P183_SF2_GUI_CATALOG_UTF8_NUL_EXCEPTION_FAIL_CLOSED_PASS' -Quiet)){
            throw 'P183 Win64 malformed GUI SoundFont input test missing'
          }
          & _p009-build/Release/P010NativeHostQA.exe $bundle --synthetic *> _p009-host-synthetic.log
          $rc=$LASTEXITCODE
          Get-Content _p009-host-synthetic.log
          if($rc -eq 0) {
            Select-String -Path _p009-host-synthetic.log -Pattern '^(P179_PACED_AUDIBLE_V5_SAVES|P187_SOUNDING_N08_ECHO|P189_CHRONOLOGICAL|P189_HELD)' | ForEach-Object {
              Write-Host ('::notice title=P189 native host QA::' + $_.Line)
            }
            foreach($gate in @(
