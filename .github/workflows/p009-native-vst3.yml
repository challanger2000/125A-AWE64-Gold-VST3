      - name: 125A Plugin Tester published v0.2.10 actual Win64 VST3 (synthetic assets)
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          # Published owner-approved version and exact GitHub release SHA;
          # never execute latest-main or unknown unverified QA binaries.
          $url='https://github.com/challanger2000/125A-Plugin-Tester-Final/releases/download/v0.2.10/125A_Plugin_Tester_v0.2.10_Windows_x64_FINAL.zip'
          $archive=Join-Path $env:GITHUB_WORKSPACE '_p009-tester-v0210.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne
             'e5b152fa5b05140f5dfc883c7dd736f572ca50c13b78d90be7505ec6e13e83af'){
            throw 'published 125A Plugin Tester v0.2.10 release SHA mismatch'
          }
          $root=Join-Path $env:GITHUB_WORKSPACE '_p009-tester-v0210'
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $tester=Get-ChildItem -Path $root -Recurse -File -Filter '125A_Plugin_Tester.exe' |
            Select-Object -First 1
          if(!$tester){throw 'published 125A Plugin Tester launcher missing'}
          $plugin=(Resolve-Path '_p009-build/VST3/Release/AWE64_Gold_Native_P009.vst3').Path
          $resource=Join-Path $plugin 'Contents/Resources/P009-Private'
          New-Item -ItemType Directory -Force -Path $resource | Out-Null
          $rom=Join-Path $resource 'awe32.raw'
          $sbk=Join-Path $resource 'SYNTHGM.SBK'
          $sf2=Join-Path $resource 'user.sf2'
          $log=Join-Path $env:GITHUB_WORKSPACE '_p009-published-tester-v0210.log'
          # Exact official tester source report_paths.h: an explicit override
          # directs ALL launcher/worker/probe sidecars into this workdir,
          # not into Windows LOCALAPPDATA where the previous search missed.
          $evidence=Join-Path $env:GITHUB_WORKSPACE '_p009-tester-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:125A_PLUGIN_TESTER_REPORT_DIR=$evidence
          try {
            # Test only with publicly generated synthetic data. Never stage
            # real owner Creative ROM/SBK/SF2 in a GitHub Actions artifact.
            [IO.File]::WriteAllBytes($rom,(New-Object byte[] 1048576))
            python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sbk --wet
            if($LASTEXITCODE -ne 0){throw 'synthetic base bank generation failed'}
            python research/native-awe32emu/p009-vst3/tests/make_public_layered_sf2.py $sf2 --expressive
            if($LASTEXITCODE -ne 0){throw 'synthetic user SF2 generation failed'}
            Push-Location -LiteralPath $tester.Directory.FullName
            try {
              # The published ZIP is a WinMain *portable GUI stub*.
              # Passing only the plugin path launches a GUI and exits
              # without the automated worker. The real embedded dispatcher
              # is invoked ONLY with the documented two-argument mode:
              # --portable-test <vst3>, which unpacks 10 helper EXEs into
              # a temporary runtime directory, runs them, then cleans up.
              # The portable entry is a GUI-subsystem wWinMain executable.
              # PowerShell's native '&' invocation may return without
              # waiting for GUI descendants; LASTEXITCODE can remain stale
              # from a successful prior Python fixture command. Explicitly
              # WAIT for this exact portable process and its real child
              # dispatcher/probes. Do not infer success from a stale zero.
              $stderrLog=Join-Path $env:GITHUB_WORKSPACE '_p009-tester-v0210-stderr.log'
              $quotedPlugin='"'+$plugin+'"'
              $child=Start-Process -FilePath $tester.FullName -ArgumentList @('--portable-test',$quotedPlugin) -WorkingDirectory $tester.Directory.FullName -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError $stderrLog
              $rc=$child.ExitCode
              Write-Host "125A_TESTER_PORTABLE_DISPATCH_EXIT_CODE=$rc"
              if(Test-Path -LiteralPath $stderrLog){
                Get-Content -LiteralPath $stderrLog | Select-Object -Last 30
              }
            } finally {Pop-Location}
            if(Test-Path $log){Get-Content -LiteralPath $log | Select-Object -Last 100}
            # Exit zero alone is not enough: retain the genuine 125A report.
            if(Test-Path -LiteralPath $log){
              Copy-Item -LiteralPath $log -Destination $evidence -Force
            }
            if(Test-Path -LiteralPath $stderrLog){
              Copy-Item -LiteralPath $stderrLog -Destination $evidence -Force
            }
            $reports=@(Get-ChildItem -LiteralPath $evidence -File |
              Where-Object {$_.Name -like '*_125A_*' -and $_.Extension -in '.txt','.json'})
            foreach($item in $reports){
              Write-Host "125A_TESTER_REPORT $($item.Name)"
            }
            if($reports.Count -eq 0){throw "125A Plugin Tester portable worker produced no QA sidecars; exit $rc"}
            $qa=@($reports|Where-Object {$_.Name -like '*_125A_QA_Report.txt'})
            if($qa.Count -ne 1){throw "125A Plugin Tester did not produce exactly one plugin QA report: $($qa.Count)"}
            $summary=@(Select-String -LiteralPath $qa[0].FullName -Pattern '^RESULT: ')
            if($summary.Count -ne 1){throw '125A Plugin Tester QA report lacks one explicit RESULT line'}
            Write-Host "125A_TESTER_VERDICT $($summary[0].Line)"
            Get-Content -LiteralPath $qa[0].FullName | Select-Object -Last 35
            if($rc -ne 0){throw "125A Plugin Tester v0.2.10 reported failure: exit $rc"}
            if($summary[0].Line -notmatch 'RESULT: [0-9]+ PASS / [0-9]+ WARNING / 0 FAIL'){
              throw '125A Plugin Tester QA result is not actual clean 0-FAIL state'
            }
            Write-Host P168_REAL_WIN64_VST3_125A_PUBLISHED_TESTER_V0210_COMPLETED_EXIT_ZERO
          } finally {
            Remove-Item -LiteralPath $rom,$sbk,$sf2 -Force -ErrorAction SilentlyContinue
          }
